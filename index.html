<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise Management System (EMS)</title>
    <!-- Google Fonts: Inter & Plus Jakarta Sans for crisp enterprise typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var isDark = localStorage.getItem('ems_dark_mode') === 'true' || localStorage.getItem('ems_theme') === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark', 'dark-mode');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.backgroundColor = '#0b0f19';
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- High-tech Instant Boot Preloader (replaced automatically on React mount) -->
      <div id="ems-boot-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0f19;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;color:#f8fafc;z-index:999999;">
        <div style="position:relative;margin-bottom:22px;display:flex;align-items:center;justify-content:center;">
          <!-- Ambient Glow -->
          <div style="position:absolute;width:80px;height:80px;background:linear-gradient(135deg,#2563eb,#4f46e5,#0284c7);filter:blur(24px);opacity:0.6;border-radius:24px;animation:emsPulse 2s ease-in-out infinite;"></div>
          <!-- Logo Box -->
          <div style="position:relative;width:68px;height:68px;background:#101b33;border:1px solid rgba(255,255,255,0.12);border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/>
              <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/>
              <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/>
              <path d="M10 6h4"/>
              <path d="M10 10h4"/>
              <path d="M10 14h4"/>
              <path d="M10 18h4"/>
            </svg>
            <!-- Orbit Ring -->
            <div style="position:absolute;inset:-4px;border:2px solid transparent;border-top-color:#38bdf8;border-right-color:#6366f1;border-radius:22px;animation:emsSpin 2s linear infinite;"></div>
          </div>
        </div>
        <div style="font-size:18px;font-weight:800;letter-spacing:-0.02em;margin-bottom:5px;background:linear-gradient(180deg,#ffffff,#cbd5e1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
          Inforag Technology
        </div>
        <div style="font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:18px;letter-spacing:0.01em;">
          Enterprise Management System
        </div>
        <!-- Progress Bar -->
        <div style="width:180px;height:4px;background:rgba(255,255,255,0.08);border-radius:999px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;height:100%;width:75px;background:linear-gradient(90deg,transparent,#38bdf8,#6366f1,transparent);border-radius:999px;animation:emsProgress 1.4s cubic-bezier(0.4,0,0.2,1) infinite;"></div>
        </div>
        <div style="margin-top:18px;font-size:11px;color:#64748b;font-weight:500;display:flex;align-items:center;gap:6px;">
          <span style="display:inline-block;width:6px;height:6px;background:#10b981;border-radius:50%;box-shadow:0 0 8px #10b981;"></span>
          Initializing Secure Workspace...
        </div>
        <style>
          @keyframes emsSpin { to { transform: rotate(360deg); } }
          @keyframes emsPulse { 0%, 100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.08); } }
          @keyframes emsProgress { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
